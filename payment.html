<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment | SitamarhiCab</title>

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f5f7;
            padding: 20px;
        }

        .payment-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #f5b400;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .ride-info {
            background: #f8f8f8;
            padding: 18px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }

        .ride-info p {
            margin: 9px 0;
            word-break: break-word;
        }

        .amount {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
        }

        #payButton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f5b400;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #payButton:hover {
            background: #dca300;
        }

        #payButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .loading {
            color: #777;
        }
    </style>
</head>

<body>

    <div class="payment-card">

        <div class="logo">
            Sitamarhi<span>Cab</span>
        </div>

        <p class="subtitle">
            Secure Test Payment
        </p>

        <div class="ride-info">

            <p>
                <strong>Ride ID:</strong>
                <span id="rideId">Loading...</span>
            </p>

            <p>
                <strong>Vehicle:</strong>
                <span id="vehicle">Loading...</span>
            </p>

        </div>

        <div class="amount">
            ₹<span id="amount">0</span>
        </div>

        <button id="payButton" disabled>
            Loading...
        </button>

        <div id="message" class="message"></div>

    </div>

    <!-- IMPORTANT: payment.js must be in same folder -->
    <script type="module" src="./payment.js"></script>

</body>

</html>
