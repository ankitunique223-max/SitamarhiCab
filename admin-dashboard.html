<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | SitamarhiCab</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 23px;
        }

        .admin-email {
            font-size: 14px;
            opacity: .9;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
        }

        #refreshBtn {
            background: #2563eb;
            color: white;
        }

        main {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .stat h2 {
            margin-top: 8px;
            font-size: 25px;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .section h2 {
            margin-bottom: 18px;
        }

        .ride-card,
        .driver-card,
        .user-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .ride-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #e5e7eb;
            font-size: 12px;
            font-weight: bold;
        }

        .ride-details p,
        .driver-card p,
        .user-card p {
            margin: 7px 0;
        }

        .assign-area {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
        }

        select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            min-width: 220px;
        }

        .assign-btn {
            background: #16a34a;
            color: white;
        }

        .reassign-btn {
            background: #f59e0b;
            color: white;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        #message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            background: white;
        }

        @media(max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            select,
            .assign-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <div>
        <h1>🚖 SitamarhiCab Admin</h1>

        <div class="admin-email" id="adminEmail">
            Loading...
        </div>
    </div>

    <button type="button" id="logoutBtn">
        Logout
    </button>

</header>

<main>

    <div class="top">

        <h2>Admin Dashboard</h2>

        <button type="button" id="refreshBtn">
            🔄 Refresh
        </button>

    </div>

    <div id="message"></div>

    <div class="stats">

        <div class="stat">
            <p>Total Users</p>
            <h2 id="totalUsers">0</h2>
        </div>

        <div class="stat">
            <p>Total Drivers</p>
            <h2 id="totalDrivers">0</h2>
        </div>

        <div class="stat">
            <p>Total Rides</p>
            <h2 id="totalRides">0</h2>
        </div>

        <div class="stat">
            <p>Revenue</p>
            <h2 id="revenue">₹0</h2>
        </div>

    </div>


    <div class="section">

        <h2>🚗 Approved Drivers</h2>

        <div id="driversContainer">
            <div class="empty">
                Loading drivers...
            </div>
        </div>

    </div>


    <div class="section">

        <h2>🚕 All Rides</h2>

        <div id="ridesContainer">
            <div class="empty">
                Loading rides...
            </div>
        </div>

    </div>


    <div class="section">

        <h2>👥 Users</h2>

        <div id="usersContainer">
            <div class="empty">
                Loading users...
            </div>
        </div>

    </div>

</main>

<script type="module" src="./admin.js"></script>

</body>
</html>
