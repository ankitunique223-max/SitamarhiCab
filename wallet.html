<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wallet | Sitamarhi Cab</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .wallet-page {
            padding: 25px;
        }

        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .wallet-header h1 {
            margin: 0;
        }

        .wallet-balance-card {
            background: #111827;
            color: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .wallet-balance-card p {
            margin: 0 0 8px;
            opacity: .8;
        }

        .wallet-balance {
            font-size: 36px;
            font-weight: bold;
        }

        .refresh-btn {
            border: none;
            background: #facc15;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .transaction-section {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .transaction-section h2 {
            margin-top: 0;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 16px 5px;
            border-bottom: 1px solid #eee;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .credit-icon {
            background: #dcfce7;
        }

        .debit-icon {
            background: #fee2e2;
        }

        .transaction-title {
            font-weight: bold;
        }

        .transaction-date {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        .credit {
            color: #16a34a;
            font-weight: bold;
        }

        .debit {
            color: #dc2626;
            font-weight: bold;
        }

        .transaction-balance {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
            text-align: right;
        }

        .empty-wallet {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }

        .empty-wallet-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
        }

        @media (max-width: 650px) {

            .wallet-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .transaction-item {
                align-items: flex-start;
            }

            .transaction-balance {
                text-align: left;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <div class="sidebar">

        <h2>🚖 Sitamarhi Cab</h2>

        <ul>

            <li>
                <i class="fa-solid fa-house"></i>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <i class="fa-solid fa-car"></i>
                <a href="book.html">Book Ride</a>
            </li>

            <li>
                <i class="fa-solid fa-clock-rotate-left"></i>
                <a href="ride-history.html">Ride History</a>
            </li>

            <li>
    <i class="fa-solid fa-wallet"></i>
    <a href="wallet.html">Wallet</a>
</li>

            <li>
                <i class="fa-solid fa-user"></i>
                <a href="profile.html">Profile</a>
            </li>

            <li>
                <i class="fa-solid fa-right-from-bracket"></i>
                <a href="login.html">Logout</a>
            </li>

        </ul>

    </div>


    <div class="main-content">

        <div class="wallet-page">

            <div class="wallet-header">

                <h1>💳 My Wallet</h1>

                <button
                    id="refreshButton"
                    class="refresh-btn"
                >
                    🔄 Refresh
                </button>

            </div>


            <div class="wallet-balance-card">

                <p>
                    Available Balance
                </p>

                <div
                    id="walletBalance"
                    class="wallet-balance"
                >
                    ₹0.00
                </div>

            </div>


            <div class="transaction-section">

                <h2>
                    📋 Transaction History
                </h2>

                <div id="transactionList">

                    <div class="empty-wallet">

                        <div class="empty-wallet-icon">
                            ⏳
                        </div>

                        <p>
                            Loading transactions...
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    type="module"
    src="wallet.js"
></script>

</body>

</html>
