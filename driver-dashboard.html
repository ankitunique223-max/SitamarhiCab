<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Driver Dashboard | SitamarhiCab</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 22px;
        }

        .driver-email {
            font-size: 14px;
            opacity: .9;
            margin-top: 5px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
        }

        #refreshBtn {
            background: #2563eb;
            color: white;
        }

        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;

            gap: 15px;
            flex-wrap: wrap;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .ride-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.08);
        }

        .ride-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;
            flex-wrap: wrap;

            margin-bottom: 18px;
        }

        .ride-status {
            padding: 7px 12px;
            border-radius: 20px;

            background: #e5e7eb;

            font-size: 12px;
            font-weight: bold;
        }

        .ride-details {
            display: grid;
            gap: 10px;

            padding-bottom: 18px;
        }

        .ride-details p {
            line-height: 1.5;
        }

        .actions {
            border-top: 1px solid #eee;

            padding-top: 16px;

            display: flex;
            gap: 10px;

            flex-wrap: wrap;
        }

        .accept-btn {
            background: #16a34a;
            color: white;
        }

        .start-btn {
            background: #2563eb;
            color: white;
        }

        .complete-btn {
            background: #7c3aed;
            color: white;
        }

        .done-btn {
            background: #6b7280;
            color: white;
            cursor: not-allowed;
        }

        .cancelled-btn {
            background: #dc2626;
            color: white;
            cursor: not-allowed;
        }

        .empty {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        @media(max-width:600px) {

            .actions button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div>

        <h1>
            🚕 SitamarhiCab Driver
        </h1>

        <div
            class="driver-email"
            id="driverName"
        >
            Loading...
        </div>

    </div>


    <button
        type="button"
        id="logoutBtn"
    >
        Logout
    </button>

</header>


<main>


    <div class="top">

        <h2>
            My Assigned Rides
        </h2>


        <button
            type="button"
            id="refreshBtn"
        >
            🔄 Refresh
        </button>

    </div>


    <div id="message"></div>


    <div id="ridesContainer">

        <div class="empty">
            Loading rides...
        </div>

    </div>


</main>


<script
    type="module"
    src="./driver.js"
></script>


</body>

</html>
