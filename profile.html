<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | SitamarhiCab</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="profile-page">

<div class="profile-card">

<img src="https://i.pravatar.cc/150?img=12" class="profile-img">

<h2>Ankit Roy</h2>

<p>Customer</p>

<div class="profile-info">

<div class="info-box">
<i class="fa-solid fa-envelope"></i>
<span>ankit@email.com</span>
</div>

<div class="info-box">
<i class="fa-solid fa-phone"></i>
<span>+91 9876543210</span>
</div>

<div class="info-box">
<i class="fa-solid fa-location-dot"></i>
<span>Sitamarhi, Bihar</span>
</div>

</div>

<div class="profile-stats">

<div>
<h3>25</h3>
<p>Rides</p>
</div>

<div>
<h3>₹4,850</h3>
<p>Total Spent</p>
</div>

<div>
<h3>4.9 ⭐</h3>
<p>Rating</p>
</div>

</div>

<div class="profile-buttons">

<button id="editBtn">
<i class="fa-solid fa-user-pen"></i>
Edit Profile
</button>

<button id="passwordBtn">
<i class="fa-solid fa-lock"></i>
Change Password
</button>

<button id="historyBtn">
<i class="fa-solid fa-clock-rotate-left"></i>
Ride History
</button>

<button id="logoutBtn">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</button>

</div>

<a href="dashboard.html" class="back-dashboard">
⬅ Back to Dashboard
</a>

</div>

</div>

<script src="profile.js"></script>

</body>
</html>
