<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Sitamarhi Cab</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🚖 Sitamarhi Cab
        </div>
        <div class="admin-badge">
    ADMIN PANEL
</div>

        <h2 class="admin-title">Admin Login</h2>

        <p class="admin-subtitle">
Manage Drivers, Users & Rides
</p>

        <form id="adminLoginForm">

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Admin Email"
                    required>
            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required>

                <span class="eye-icon" id="toggleAdminPassword">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <div class="divider">
            Admin Access Only
        </div>

        <div class="admin-footer">
    <a href="index.html">
        ← Back to Home
    </a>
</div>

    </div>

</div>

<script type="module" src="admin-login.js"></script>

</body>
</html>
